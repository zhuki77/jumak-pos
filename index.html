<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>물리학과 주막 POS</title>
  <style>
    :root {
      --bg: #101318;
      --card: #202633;
      --line: #343c4d;
      --text: #f6f3ec;
      --muted: #b7b0a4;
      --orange: #ff8a34;
      --orange-ink: #1a1008;
      --orange-bg: #2a2018;
      --blue: #2f6fed;
      --red: #ff6b6b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1000px 420px at 0% -10%, rgba(255, 138, 52, .18), transparent 55%),
        radial-gradient(800px 380px at 100% 0%, rgba(47, 111, 237, .16), transparent 50%),
        var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    body.modal-open { overflow: hidden; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    h1, h2, h3, p { margin: 0; }
    .wrap { width: min(860px, calc(100% - 28px)); margin: 0 auto; }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 12px 0 14px;
      background: rgba(16, 19, 24, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand-row, .line, .acct, .cart-top, .amount-row, .dock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .eyebrow { color: var(--orange); font-size: .78rem; font-weight: 800; }
    h1 { font-size: 1.22rem; letter-spacing: -.03em; }
    .sync { margin: 4px 0 0; color: var(--muted); font-size: .82rem; font-weight: 800; }
    #clock { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tabs button, .filters button {
      flex: 1;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: #2a3140;
      font-weight: 800;
      line-height: 1.25;
      padding: 8px 6px;
    }
    .tabs button.on, .filters button.on { background: var(--orange); color: var(--orange-ink); }
    .tabs button { flex: 1 1 calc(50% - 4px); }
    .cover-btn {
      display: flex;
      width: 100%;
      margin-top: 12px;
      min-height: 56px;
      padding: 12px 14px;
      justify-content: space-between;
      align-items: center;
      border: 0;
      border-radius: 16px;
      background: var(--orange);
      color: var(--orange-ink);
      font-weight: 800;
    }
    .cover-btn.on { box-shadow: inset 0 0 0 2px #1a1008; }
    .cover-btn span { font-size: .86rem; }
    .table-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
    .table-grid button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #2a3140;
      font-weight: 800;
    }
    .table-grid button.on { background: var(--orange); color: var(--orange-ink); }
    .table-grid button:disabled {
      background: #171b24;
      color: #6e675d;
      text-decoration: line-through;
      cursor: not-allowed;
    }
    .table-grid.lookup button {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      min-height: 56px;
      padding: 6px 2px;
    }
    .table-grid.lookup small { font-size: .72rem; font-weight: 800; color: var(--muted); }
    .table-grid.lookup button.on small { color: var(--orange-ink); }
    .copy-btn, .primary, .pay, .ghost, .danger-btn, .zero, .list-btn, .menu-main, .stepper button {
      border: 0;
      border-radius: 12px;
      font-weight: 800;
    }
    .copy-btn, .zero, .list-btn {
      min-width: 72px;
      min-height: 48px;
      padding: 0 12px;
      background: var(--orange);
      color: var(--orange-ink);
    }
    .list-btn { background: #2a3140; color: var(--text); }
    .list-btn.on { background: var(--orange); color: var(--orange-ink); }
    main.wrap { padding: 16px 0 120px; }
    h2 { font-size: 1.25rem; }
    .quiet, .desc { color: var(--muted); }
    .cats { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; }
    .cats button {
      flex: 1 0 auto;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #2a3140;
      font-weight: 800;
      white-space: nowrap;
      padding: 0 14px;
    }
    .cats button.on { background: var(--orange); color: var(--orange-ink); }
    .menus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .menu {
      border-radius: 16px;
      border: 2px solid var(--line);
      background: var(--card);
      padding: 12px;
    }
    .menu.picked { border-color: var(--orange); }
    .menu-main { width: 100%; min-height: 88px; padding: 0; background: transparent; text-align: left; }
    .menu-copy strong, .menu-copy b, .desc { display: block; }
    .menu-copy b, .price { margin-top: 6px; color: var(--orange); }
    .menu-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .menu-line + .menu-line { margin-top: 10px; }
    .desc { margin-top: 4px; font-size: .82rem; font-weight: 700; }
    .opts { display: grid; gap: 8px; margin-top: 8px; }
    .opts button { min-height: 48px; border: 0; border-radius: 12px; background: #2a3348; color: white; font-weight: 800; }
    .cart, .panel, .rank {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }
    .cart { margin: 14px 0; display: grid; gap: 12px; }
    .cart-line { padding-top: 8px; border-top: 1px solid var(--line); }
    .cart-line:first-of-type { border-top: 0; padding-top: 0; }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper button { width: 48px; height: 48px; background: #313a4e; color: white; font-size: 1.4rem; }
    .stepper b { min-width: 1.4ch; text-align: center; font-size: 1.2rem; }
    .amount-row { margin-top: 8px; }
    .amount-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: #121722;
      padding: 0 12px;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .done-head { margin: 22px 0 10px; }
    .ranks { display: grid; gap: 10px; }
    .rank { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .rank b { font-size: 1.05rem; }
    .rank strong { text-align: right; font-variant-numeric: tabular-nums; }
    .rank strong span { display: block; margin-top: 2px; }
    .rank.total { border-color: var(--orange); }
    .stock-row { align-items: flex-start; }
    .stock-row .meta { display: block; margin-top: 4px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    .stock-row.low { border-color: var(--orange); }
    .stock-row.out { border-color: var(--red); }
    .stock-row.out strong { color: var(--red); }
    .total-zone { margin-top: 28px; }
    .filters { display: flex; gap: 8px; margin-top: 8px; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .summary article, .order-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }
    .summary span { color: var(--muted); font-size: .82rem; font-weight: 800; }
    .summary strong { display: block; margin-top: 6px; font-size: 1.35rem; }
    .order-list { display: grid; gap: 10px; }
    .note-field { display: grid; gap: 8px; margin-top: 14px; font-weight: 800; }
    .note-field textarea, .note-field input {
      border-radius: 12px;
      border: 2px solid var(--line);
      background: #121722;
      color: inherit;
      padding: 12px;
    }
    .note-field textarea { min-height: 76px; resize: vertical; }
    .note-field input { min-height: 52px; padding: 0 12px; }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .pager button {
      min-height: 48px;
      min-width: 84px;
      border: 0;
      border-radius: 12px;
      background: #2a3140;
      font-weight: 800;
    }
    .pager button:disabled { opacity: .35; }
    .pager span { font-weight: 800; font-variant-numeric: tabular-nums; }
    .item-line { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
    .item-line:first-child { border-top: 0; padding-top: 0; }
    .item-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .item-meta .quiet { white-space: nowrap; }
    .status-row { display: flex; gap: 6px; flex: none; }
    .status-btn {
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1a2030;
      font-size: .75rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .status-btn.cook.on { background: var(--orange); color: var(--orange-ink); border-color: var(--orange); }
    .status-btn.done.on { background: #2f9e6b; color: #04140c; border-color: #3dcc8a; }
    .order-card.served { border-color: #3dcc8a; }
    .order-card.editing { border-color: var(--orange); }
    .served-mark {
      justify-self: start;
      padding: 3px 8px;
      border-radius: 8px;
      background: #2f9e6b;
      color: #04140c;
      font-size: .75rem;
      font-weight: 800;
    }
    .order-card { display: grid; gap: 8px; }
    .order-head, .order-sum { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .order-toggle {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 48px;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .order-brief { display: grid; gap: 4px; min-width: 0; }
    .order-fold {
      flex: none;
      min-width: 64px;
      min-height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      background: #2a3140;
      font-size: .82rem;
      font-weight: 800;
      display: grid;
      place-items: center;
    }
    .order-card.open .order-fold { background: var(--orange); color: var(--orange-ink); }
    .order-body { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
    .order-card ul { margin: 0; padding-left: 18px; }
    .order-card li { margin: 4px 0; }
    .orders { display: grid; gap: 8px; }
    .order {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .order:last-child { border-bottom: 0; }
    .text-btn { min-height: 44px; border: 0; background: transparent; color: var(--muted); font-weight: 800; }
    .reserve-actions { display: flex; align-items: center; gap: 6px; }
    .confirm-reserve {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid #3dcc8a;
      border-radius: 10px;
      background: #163526;
      color: #d7ffe9;
      font-weight: 800;
      white-space: nowrap;
    }
    .confirm-reserve.on, .confirm-reserve:disabled {
      background: #2f9e6b;
      color: #04140c;
      border-color: #3dcc8a;
    }
    .enter-reserve {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid #7eb0ff;
      border-radius: 10px;
      background: #1a2740;
      color: #d7e6ff;
      font-weight: 800;
      white-space: nowrap;
    }
    .enter-reserve.on, .enter-reserve:disabled {
      background: #2f6fed;
      color: #041018;
      border-color: #7eb0ff;
    }
    .source-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2a2018;
      color: var(--orange);
      font-size: .75rem;
      vertical-align: 1px;
    }
    .source-tag.walk { background: #1a2436; color: #9ec0ff; }
    .danger-btn { width: 100%; min-height: 56px; background: transparent; color: #ffd4d4; border: 2px solid var(--red); }
    .reset-slot { margin: 10px 0 4px; text-align: right; }
    .reset-mini {
      min-height: 32px;
      padding: 2px 4px;
      border: 0;
      background: transparent;
      color: #8d8080;
      font-size: .75rem;
      font-weight: 700;
    }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      background: rgba(16, 19, 24, .96);
      border-top: 1px solid var(--line);
    }
    .dock .wrap { display: flex; align-items: center; gap: 12px; }
    .dock b { display: block; font-size: 1.25rem; }
    .dock .quiet { font-size: .82rem; font-weight: 700; }
    .pay { flex: 1; min-height: 56px; background: var(--blue); color: white; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, .62);
      padding: 16px;
    }
    .confirm {
      width: min(480px, 100%);
      padding: 18px;
      border-radius: 20px;
      background: #1b212c;
      border: 1px solid var(--line);
    }
    .confirm p { margin: 10px 0 16px; color: var(--muted); font-weight: 700; line-height: 1.45; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button { flex: 1; min-height: 52px; }
    .ghost { background: #2a3140; color: var(--text); }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 96px;
      z-index: 30;
      max-width: calc(100% - 32px);
      padding: 14px 18px;
      border-radius: 999px;
      background: #fff6e8;
      color: #1a1008;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
      transition: .2s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (min-width: 720px) {
      .menus { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .overlay { align-items: center; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const STORAGE_KEY = "jumak-festival-pos-v2";
    const COVER_ID = "cover";
    const TABLE_COUNT = 16;
    const FESTIVAL_DAYS = [
      { key: "2026-10-01", label: "1일차" },
      { key: "2026-10-02", label: "2일차" }
    ];
    const CATEGORIES = [

    ];
    const MENU = [
      { id: "modum", cat: "skewer", name: "모둠꼬치", desc: "염통 4 · 목살 2 · 닭껍질 2", price: 15900 },

      { id: "potato", cat: "meal", name: "감자전", desc: "", price: 14900 },

      { id: "drink", cat: "drink", name: "음료", desc: "콜라 · 제로콜라 · 사이다", price: 2500, options: ["콜라", "제로콜라", "사이다"] },
      { id: "water", cat: "drink", name: "생수", desc: "", price: 1000 },
      { id: "cover", cat: "fee", name: "상차림비", desc: "", price: 2000 }
    ];
    const STOCK = [
      { id: "heart", group: "꼬치 재료", name: "염통", unit: "개", initial: 900, pack: 4, note: "1세트 4개 · 모둠꼬치에도 4개" },
      { id: "pork", group: "꼬치 재료", name: "목살", unit: "개", initial: 600, pack: 2, note: "1세트 2개 · 모둠꼬치에도 2개" },
      { id: "skin", group: "꼬치 재료", name: "닭껍질", unit: "개", initial: 600, pack: 2, note: "1세트 2개 · 모둠꼬치에도 2개" },
      { id: "oden", group: "식사·사이드", name: "오뎅전골", unit: "그릇", initial: 120, note: "예상 수량" },
      { id: "udon", group: "식사·사이드", name: "야끼우동", unit: "개", initial: 130 },
      { id: "potato", group: "식사·사이드", name: "감자전", unit: "접시", initial: 150, piece: 4, note: "1접시 4개 · 구매 600개" },
      { id: "tomato", group: "식사·사이드", name: "설탕토마토", unit: "개", initial: 90, note: "배송 오면 수량을 다시 확인" },
      { id: "earl", group: "하이볼", name: "얼그레이 하이볼", unit: "잔", initial: 150 },
      { id: "grapefruit", group: "하이볼", name: "자몽 하이볼", unit: "잔", initial: 150 },
      { id: "lemon", group: "하이볼", name: "레몬 하이볼", unit: "잔", initial: 150 },
      { id: "cola", group: "음료·생수", name: "콜라", unit: "개", initial: 120 },
      { id: "zerocola", group: "음료·생수", name: "제로콜라", unit: "개", initial: 120 },
      { id: "cider", group: "음료·생수", name: "사이다", unit: "개", initial: 120 },
      { id: "water", group: "음료·생수", name: "생수", unit: "개", initial: 400 }
    ];
    const CLOUD_APP = "6m8ooszg";
    const CLOUD_ROOT = "https://keyvalue.immanuel.co/api/KeyVal";

    let localOps = [];
    let syncedSet = new Set();
    let seenN = 0;
    let seenLast = "";
    let state = { orders: [], reservations: [] };
    let syncLabel = "연결하는 중";
    let chain = Promise.resolve();
    let toastTimer = 0;
    const ui = {
      day: "",
      cat: "skewer",
      optionFor: "",
      screen: "order",
      statsRange: "all",
      tableFocus: 1,
      tablePage: 0,
      orderPage: 0,
      openOrders: new Set(),
      drafts: { "2026-10-01": [], "2026-10-02": [] },
      notes: { "2026-10-01": "", "2026-10-02": "" },
      tables: { "2026-10-01": [], "2026-10-02": [] },
      reserve: { day: "", name: "", phone: "", party: 2, time: "", tables: [], note: "", source: "pre", editId: "" },
      confirm: null
    };

    function uid() {
      return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
    }

    function dayKey(ts) {
      const date = new Date(ts);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day}`;
    }

    function dayTitle(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day).toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
    }

    function activeDay() {
      if (FESTIVAL_DAYS.some((day) => day.key === ui.day)) return ui.day;
      const today = dayKey(Date.now());
      return today >= "2026-10-02" ? "2026-10-02" : "2026-10-01";
    }

    function won(amount) {
      return `${Number(amount || 0).toLocaleString("ko-KR")}원`;
    }

    function hhmm(ts) {
      const date = new Date(ts);
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function lineKey(menuId, option) {
      return `${menuId}|${option || ""}`;
    }

    function itemLabel(item) {
      return item.option ? `${item.name} (${item.option})` : item.name;
    }

    function hydrate(item) {
      const menu = MENU.find((entry) => entry.id === item.menuId);
      return {
        menuId: item.menuId,
        name: menu ? menu.name : item.menuId,
        option: item.option || "",
        qty: item.qty || 0,
        price: menu ? menu.price : 0,
        amount: item.amount || 0,
        status: ""
      };
    }

    function replay(ops) {
      const orders = [];
      const reservations = [];
      ops.forEach((op) => {
        if (!op || !op.kind) return;
        if (op.kind === "R") {
          orders.length = 0;
          reservations.length = 0;
          return;
        }
        if (op.kind === "D") {
          for (let i = orders.length - 1; i >= 0; i--) {
            if (orders[i].day === op.day) orders.splice(i, 1);
          }
          return;
        }
        if (op.kind === "O") {
          const items = (op.items || []).map(hydrate);
          orders.push({
            id: op.id,
            day: op.day,
            at: op.at,
            seq: op.seq || 0,
            note: op.note || "",
            tables: op.tables || [],
            items,
            total: items.reduce((sum, item) => sum + (item.amount || 0), 0)
          });
        } else if (op.kind === "S") {
          const order = orders.find((item) => item.id === op.orderId);
          const allowed = op.status === "cook" || op.status === "done" || op.status === "";
          if (order && allowed) {
            if (Number.isInteger(op.index) && order.items[op.index]) order.items[op.index].status = op.status;
            else if (op.index == null) order.items.forEach((item) => { item.status = op.status; });
          }
        } else if (op.kind === "X") {
          const index = orders.findIndex((order) => order.id === op.orderId);
          if (index >= 0) orders.splice(index, 1);
        } else if (op.kind === "P") {
          reservations.push({
            id: op.id,
            day: op.day,
            at: op.at,
            name: op.name || "",
            phone: op.phone || "",
            party: op.party || 1,
            time: op.time || "",
            tables: op.tables || [],
            note: op.note || "",
            source: op.source === "walk" ? "walk" : "pre"
          });
        } else if (op.kind === "Q") {
          const index = reservations.findIndex((item) => item.id === op.reserveId);
          if (index >= 0) reservations.splice(index, 1);
        } else if (op.kind === "U") {
          const found = reservations.find((item) => item.id === op.reserveId);
          if (found) {
            found.day = op.day;
            found.name = op.name || "";
            found.phone = op.phone || "";
            found.party = op.party || 1;
            found.time = op.time || "";
            found.tables = op.tables || [];
            found.note = op.note || "";
            found.source = op.source === "walk" ? "walk" : "pre";
          }
        } else if (op.kind === "F") {
          const item = reservations.find((entry) => entry.id === op.reserveId);
          if (item) item.confirmed = true;
        } else if (op.kind === "E") {
          const item = reservations.find((entry) => entry.id === op.reserveId);
          if (item) {
            item.entered = true;
            item.enteredAt = op.at || item.at;
          }
        }
      });
      return { orders, reservations };
    }

    function loadBundle() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!data || !Array.isArray(data.ops)) return { ops: [], synced: [], headN: 0, headLast: "" };
        return {
          ops: data.ops,
          synced: Array.isArray(data.synced) ? data.synced : [],
          headN: data.headN || 0,
          headLast: data.headLast || ""
        };
      } catch (err) {
        return { ops: [], synced: [], headN: 0, headLast: "" };
      }
    }

    function saveLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          ops: localOps,
          synced: [...syncedSet],
          headN: seenN,
          headLast: seenLast
        }));
      } catch (err) {
        toast("이 브라우저에는 주문을 저장할 수 없습니다.");
      }
    }

    function rememberBundle() {
      const bundle = loadBundle();
      localOps = bundle.ops;
      syncedSet = new Set(bundle.synced);
      seenN = bundle.headN;
      seenLast = bundle.headLast;
      state = replay(localOps);
    }

    function bytesToB64url(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function b64urlToText(value) {
      let text = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
      while (text.length % 4) text += "=";
      const bin = atob(text);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function splitUtf8(text, maxBytes) {
      const enc = new TextEncoder();
      const parts = [];
      let current = "";
      for (const ch of text) {
        const next = current + ch;
        if (enc.encode(next).length > maxBytes && current) {
          parts.push(current);
          current = ch;
        } else current = next;
      }
      if (current) parts.push(current);
      return parts.length ? parts : [""];
    }

    async function cloudGet(key) {
      const res = await fetch(`${CLOUD_ROOT}/GetValue/${CLOUD_APP}/${key}`, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error("get");
      const raw = await res.text();
      if (!raw || raw === '""') return "";
      const data = JSON.parse(raw);
      if (!data) return "";
      return b64urlToText(data);
    }

    async function cloudPut(key, text) {
      const encoded = bytesToB64url(new TextEncoder().encode(text));
      const res = await fetch(`${CLOUD_ROOT}/UpdateValue/${CLOUD_APP}/${key}/${encoded}`, { method: "POST", signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error("put");
    }

    async function putBlob(id, text) {
      const parts = splitUtf8(text, 80);
      await cloudPut("n" + id, parts.length + "|" + parts[0]);
      for (let i = 1; i < parts.length; i++) await cloudPut("n" + id + "x" + i, parts[i]);
    }

    async function getBlob(id) {
      const first = await cloudGet("n" + id);
      const bar = first.indexOf("|");
      const count = Number(first.slice(0, bar));
      let text = first.slice(bar + 1);
      for (let i = 1; i < count; i++) text += await cloudGet("n" + id + "x" + i);
      return text;
    }

    function encodeField(value, max) {
      return encodeURIComponent(String(value || "").slice(0, max));
    }

    function encodeNote(note) {
      return encodeField(note, 80);
    }

    function decodeNote(value) {
      try { return decodeURIComponent(value || ""); } catch (err) { return ""; }
    }

    function parseItems(text) {
      return String(text || "").split(";").filter(Boolean).map((row) => {
        const cols = row.split(",");
        return {
          menuId: cols[0],
          qty: Number(cols[1]) || 0,
          amount: Number(cols[2]) || 0,
          option: cols.slice(3).join(",")
        };
      });
    }

    function serialize(op) {
      if (op.kind === "O") {
        const items = op.items.map((item) => [item.menuId, item.qty, item.amount, item.option || ""].join(",")).join(";");
        if (op.tables) return ["O3", op.day, op.at, op.seq || 0, encodeNote(op.note), op.tables.join(","), items].join("|");
        if (op.seq || op.note) return ["O2", op.day, op.at, op.seq || 0, encodeNote(op.note), items].join("|");
        return ["O", op.day, op.at, items].join("|");
      }
      if (op.kind === "S") return ["S", op.orderId, op.status || "", op.index].join("|");
      if (op.kind === "X") return ["X", op.orderId].join("|");
      if (op.kind === "D") return ["D", op.day].join("|");
      if (op.kind === "R") return ["R", op.epoch].join("|");
      if (op.kind === "P") {
        return ["P", op.day, op.at, encodeField(op.name, 20), encodeField(op.phone, 13), op.party || 1, encodeField(op.time, 5), (op.tables || []).join(","), encodeNote(op.note), op.source === "walk" ? "walk" : "pre"].join("|");
      }
      if (op.kind === "Q") return ["Q", op.reserveId].join("|");
      if (op.kind === "U") {
        return ["U", op.reserveId, op.day, encodeField(op.name, 20), encodeField(op.phone, 13), op.party || 1, encodeField(op.time, 5), (op.tables || []).join(","), encodeNote(op.note), op.source === "walk" ? "walk" : "pre"].join("|");
      }
      if (op.kind === "F") return ["F", op.reserveId].join("|");
      if (op.kind === "E") return ["E", op.reserveId, op.at || 0].join("|");
      return "";
    }

    function parseOp(text) {
      const parts = String(text || "").split("|");
      if (parts[0] === "O3") {
        return {
          kind: "O",
          day: parts[1],
          at: Number(parts[2]) || 0,
          seq: Number(parts[3]) || 0,
          note: decodeNote(parts[4]),
          tables: String(parts[5] || "").split(",").map(Number).filter((num) => num >= 1 && num <= TABLE_COUNT),
          items: parseItems(parts.slice(6).join("|"))
        };
      }
      if (parts[0] === "O2") {
        return {
          kind: "O",
          day: parts[1],
          at: Number(parts[2]) || 0,
          seq: Number(parts[3]) || 0,
          note: decodeNote(parts[4]),
          items: parseItems(parts.slice(5).join("|"))
        };
      }
      if (parts[0] === "O") {
        return { kind: "O", day: parts[1], at: Number(parts[2]) || 0, seq: 0, note: "", items: parseItems(parts.slice(3).join("|")) };
      }
      if (parts[0] === "S") {
        const index = parts.length > 3 ? Number(parts[3]) : null;
        return { kind: "S", orderId: parts[1], status: parts[2] || "", index: Number.isInteger(index) ? index : null };
      }
      if (parts[0] === "X") return { kind: "X", orderId: parts[1] };
      if (parts[0] === "D") return { kind: "D", day: parts[1] };
      if (parts[0] === "R") return { kind: "R", epoch: Number(parts[1]) || 0 };
      if (parts[0] === "P") {
        return {
          kind: "P",
          day: parts[1],
          at: Number(parts[2]) || 0,
          name: decodeNote(parts[3]).slice(0, 20),
          phone: String(decodeNote(parts[4]) || "").replace(/[^\d]/g, "").slice(0, 13),
          party: Math.min(30, Math.max(1, Number(parts[5]) || 1)),
          time: decodeNote(parts[6]).slice(0, 5),
          tables: String(parts[7] || "").split(",").map(Number).filter((num) => num >= 1 && num <= TABLE_COUNT),
          note: decodeNote(parts[8] || "").slice(0, 80),
          source: parts[9] === "walk" ? "walk" : "pre"
        };
      }
      if (parts[0] === "Q") return { kind: "Q", reserveId: parts[1] };
      if (parts[0] === "U") {
        return {
          kind: "U",
          reserveId: parts[1],
          day: parts[2],
          name: decodeNote(parts[3]).slice(0, 20),
          phone: String(decodeNote(parts[4]) || "").replace(/[^\d]/g, "").slice(0, 13),
          party: Math.min(30, Math.max(1, Number(parts[5]) || 1)),
          time: decodeNote(parts[6]).slice(0, 5),
          tables: String(parts[7] || "").split(",").map(Number).filter((num) => num >= 1 && num <= TABLE_COUNT),
          note: decodeNote(parts[8] || "").slice(0, 80),
          source: parts[9] === "walk" ? "walk" : "pre"
        };
      }
      if (parts[0] === "F") return { kind: "F", reserveId: parts[1] };
      if (parts[0] === "E") return { kind: "E", reserveId: parts[1], at: Number(parts[2]) || 0 };
      return null;
    }

    async function readHead() {
      const raw = await cloudGet("h2");
      if (!raw) return { page: 0, n: 0, last: "" };
      const data = JSON.parse(raw);
      return { page: Number(data.page) || 0, n: Number(data.n) || 0, last: data.last || "" };
    }

    async function readAllIds(head) {
      if (!head.n) return [];
      const ids = [];
      for (let page = 0; page <= head.page; page++) {
        const text = await cloudGet("g" + page);
        if (text) ids.push(...text.split(",").filter(Boolean));
      }
      return ids;
    }

    async function appendToIndex(id) {
      for (let attempt = 0; attempt < 8; attempt++) {
        const head = await readHead();
        if (head.last === id) return head;
        const pageText = head.n ? await cloudGet("g" + head.page) : "";
        const pageIds = pageText ? pageText.split(",").filter(Boolean) : [];
        if (pageIds.includes(id)) return head;
        if (attempt > 0) {
          const all = await readAllIds(head);
          if (all.includes(id)) return head;
        }
        let page = head.page;
        let list = pageIds.concat(id);
        if (list.join(",").length > 120 && pageIds.length) {
          page += 1;
          list = [id];
        }
        await cloudPut("g" + page, list.join(","));
        const next = { page, n: head.n + 1, last: id };
        await cloudPut("h2", JSON.stringify(next));
        const check = await readHead();
        if (check.last === id) return check;
        await new Promise((resolve) => setTimeout(resolve, 150 * (attempt + 1)));
      }
      throw new Error("index");
    }

    function paintSync() {
      const el = document.getElementById("sync");
      if (el) el.textContent = syncLabel;
    }

    function enqueue(task) {
      chain = chain.then(task, task);
      return chain;
    }

    async function pushPending() {
      const pending = localOps.filter((op) => op && op.id && !syncedSet.has(op.id));
      if (!pending.length) return;
      syncLabel = "저장하는 중";
      paintSync();
      for (const op of pending) {
        await putBlob(op.id, serialize(op));
        const head = await appendToIndex(op.id);
        syncedSet.add(op.id);
        seenN = head.n;
        seenLast = head.last;
      }
      syncLabel = "다른 기기와 연결됨";
      saveLocal();
      paintSync();
    }

    async function pull() {
      const head = await readHead();
      if (!head.n && !localOps.length) {
        syncLabel = "다른 기기와 연결됨";
        paintSync();
        return;
      }
      if (head.n === seenN && head.last === seenLast) {
        syncLabel = "다른 기기와 연결됨";
        paintSync();
        return;
      }
      const ids = await readAllIds(head);
      const byId = new Map(localOps.map((op) => [op.id, op]));
      const remoteOps = [];
      for (const id of ids) {
        if (byId.has(id)) {
          remoteOps.push(byId.get(id));
          continue;
        }
        const parsed = parseOp(await getBlob(id));
        if (!parsed) continue;
        parsed.id = id;
        remoteOps.push(parsed);
      }
      const remoteIds = new Set(ids);
      const pending = localOps.filter((op) => op && op.id && !remoteIds.has(op.id));
      localOps = remoteOps.concat(pending);
      ids.forEach((id) => syncedSet.add(id));
      seenN = head.n;
      seenLast = head.last;
      const before = JSON.stringify(state.orders) + JSON.stringify(state.reservations || []);
      state = replay(localOps);
      saveLocal();
      syncLabel = "다른 기기와 연결됨";
      const typing = document.activeElement && document.activeElement.dataset && (document.activeElement.dataset.amount || document.activeElement.dataset.note !== undefined || document.activeElement.dataset.reserve !== undefined);
      if (!typing && before !== JSON.stringify(state.orders) + JSON.stringify(state.reservations || [])) render();
      else paintSync();
    }

    function commit(op) {
      localOps.push(op);
      state = replay(localOps);
      saveLocal();
      enqueue(() => pushPending());
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function currentDraft() {
      const day = activeDay();
      if (!ui.drafts[day]) ui.drafts[day] = [];
      return ui.drafts[day];
    }

    function cartTotal() {
      return currentDraft().reduce((sum, line) => sum + (Number(line.amount) || 0), 0);
    }

    function ordersOn(day) {
      return state.orders.filter((order) => order.day === day);
    }

    function addLine(menuId, option) {
      const menu = MENU.find((item) => item.id === menuId);
      if (!menu) return;
      const key = lineKey(menuId, option);
      const draft = currentDraft();
      const line = draft.find((item) => item.key === key);
      if (line) {
        if (line.qty >= 99) return;
        line.qty += 1;
        if (!line.custom) line.amount = line.price * line.qty;
        return;
      }
      draft.push({
        key,
        menuId: menu.id,
        name: menu.name,
        option: option || "",
        price: menu.price,
        qty: 1,
        amount: menu.price,
        custom: false
      });
    }

    function changeQty(key, delta) {
      const draft = currentDraft();
      const line = draft.find((item) => item.key === key);
      if (!line) return;
      line.qty = Math.min(99, line.qty + delta);
      if (line.qty <= 0) {
        ui.drafts[activeDay()] = draft.filter((item) => item !== line);
        return;
      }
      if (!line.custom) line.amount = line.price * line.qty;
    }

    function setAmount(key, amount, custom) {
      const line = currentDraft().find((item) => item.key === key);
      if (!line) return;
      line.amount = Math.max(0, Math.min(9999999, Math.floor(Number(amount) || 0)));
      line.custom = custom;
      if (!custom) line.amount = line.price * line.qty;
    }

    function nextSeq(day) {
      let max = 0;
      localOps.forEach((op) => {
        if (!op) return;
        if (op.kind === "R" || (op.kind === "D" && op.day === day)) max = 0;
        if (op.kind === "O" && op.day === day) max = Math.max(max, op.seq || 0);
      });
      return max + 1;
    }

    function orderNo(order) {
      if (order.seq) return String(order.seq).padStart(3, "0");
      const same = state.orders.filter((item) => item.day === order.day).slice().sort((a, b) => a.at - b.at);
      return String(Math.max(1, same.findIndex((item) => item.id === order.id) + 1)).padStart(3, "0");
    }

    function dayLabel(key) {
      const found = FESTIVAL_DAYS.find((item) => item.key === key);
      return found ? found.label : "";
    }

    function currentTables() {
      const day = activeDay();
      if (!Array.isArray(ui.tables[day])) ui.tables[day] = [];
      return ui.tables[day];
    }

    function tableText(tables) {
      const nums = [...new Set((tables || []).map(Number).filter((num) => num >= 1 && num <= TABLE_COUNT))].sort((a, b) => a - b);
      if (!nums.length) return "테이블 없음";
      return `테이블 ${nums.map((num) => `${num}번`).join(", ")}`;
    }

    function submitOrder() {
      const draft = currentDraft().filter((line) => line.qty > 0);
      if (!draft.length) return;
      const day = activeDay();
      const tables = currentTables().slice().sort((a, b) => a - b);
      if (!tables.length) {
        toast("테이블을 골라 주세요.");
        ui.confirm = null;
        render();
        return;
      }
      const items = draft.map((line) => ({
        menuId: line.menuId,
        qty: line.qty,
        amount: Number(line.amount) || 0,
        option: line.option || ""
      }));
      const note = String(ui.notes[day] || "").trim().slice(0, 80);
      commit({ kind: "O", id: uid(), day, at: Date.now(), seq: nextSeq(day), note, tables, items });
      ui.drafts[day] = [];
      ui.notes[day] = "";
      ui.tables[day] = [];
      ui.confirm = null;
      const total = items.reduce((sum, item) => sum + item.amount, 0);
      toast(`${dayLabel(day)}에 ${won(total)}을 접수했습니다.`);
      render();
    }

    function needsKitchen(menuId) {
      const menu = MENU.find((item) => item.id === menuId);
      return Boolean(menu) && menu.cat !== "drink" && menu.id !== COVER_ID;
    }

    function orderFullyServed(order) {
      const kitchen = (order.items || []).filter((item) => needsKitchen(item.menuId));
      return kitchen.length > 0 && kitchen.every((item) => item.status === "done");
    }

    function setStatus(orderId, index, status) {
      const order = state.orders.find((item) => item.id === orderId);
      const line = order && order.items[index];
      if (!line || !needsKitchen(line.menuId)) return;
      const next = line.status === status ? "" : status;
      commit({ kind: "S", id: uid(), orderId, status: next, index });
      render();
    }

    function cancelOrder(orderId) {
      commit({ kind: "X", id: uid(), orderId });
      ui.confirm = null;
      toast("접수를 취소했습니다.");
      render();
    }

    function resetDays(days) {
      days.forEach((day) => {
        localOps = localOps.filter((op) => syncedSet.has(op.id) || op.kind !== "O" || op.day !== day);
        localOps.push({ kind: "D", id: uid(), day });
        ui.drafts[day] = [];
        ui.notes[day] = "";
        ui.tables[day] = [];
      });
      state = replay(localOps);
      saveLocal();
      enqueue(() => pushPending());
      ui.confirm = null;
      toast(days.length > 1 ? "1일차와 2일차 접수를 초기화했습니다." : `${dayLabel(days[0])} 접수를 초기화했습니다.`);
      render();
    }

    function menuStats(orders) {
      const map = new Map();
      orders.forEach((order) => {
        order.items.forEach((item) => {
          const key = lineKey(item.menuId, item.option);
          const prev = map.get(key) || { qty: 0, amount: 0 };
          prev.qty += item.qty;
          prev.amount += item.amount;
          map.set(key, prev);
        });
      });
      return map;
    }

    function sumOrders(orders) {
      let menuQty = 0;
      let menuAmount = 0;
      let coverQty = 0;
      let coverAmount = 0;
      orders.forEach((order) => {
        order.items.forEach((item) => {
          if (item.menuId === COVER_ID) {
            coverQty += item.qty;
            coverAmount += item.amount;
            return;
          }
          menuQty += item.qty;
          menuAmount += item.amount;
        });
      });
      return { menuQty, menuAmount, coverQty, coverAmount, revenue: menuAmount + coverAmount, count: orders.length };
    }

    function rangeOrders() {
      if (ui.statsRange === "all") return state.orders.slice();
      return ordersOn(ui.statsRange);
    }

    function qtyOf(menuId, option) {
      const line = currentDraft().find((item) => item.key === lineKey(menuId, option || ""));
      return line ? line.qty : 0;
    }

    function menuStepper(menuId, option, label) {
      return `
        <span class="stepper">
          <button type="button" data-action="dec-menu" data-id="${esc(menuId)}" data-option="${esc(option || "")}" aria-label="${esc(label)} 수량 줄이기">−</button>
          <b>${qtyOf(menuId, option)}</b>
          <button type="button" data-action="inc-menu" data-id="${esc(menuId)}" data-option="${esc(option || "")}" aria-label="${esc(label)} 수량 늘리기">+</button>
        </span>`;
    }

    function phoneDigits(value) {
      return String(value || "").replace(/[^\d]/g, "").slice(0, 13);
    }

    function phoneText(value) {
      const digits = phoneDigits(value);
      if (digits.length === 11) return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
      if (digits.length === 10) return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
      return digits;
    }

    function reserveDay() {
      if (!FESTIVAL_DAYS.some((item) => item.key === ui.reserve.day)) ui.reserve.day = activeDay();
      return ui.reserve.day;
    }

    function takenTablesFor(day, time, exceptId) {
      const slot = String(time || "").slice(0, 5);
      const taken = new Set();
      if (!/^\d{2}:\d{2}$/.test(slot)) return taken;
      (state.reservations || []).forEach((item) => {
        if (!item || item.id === exceptId) return;
        if (item.day !== day) return;
        if (String(item.time || "").slice(0, 5) !== slot) return;
        (item.tables || []).forEach((num) => {
          const table = Number(num);
          if (table >= 1 && table <= TABLE_COUNT) taken.add(table);
        });
      });
      return taken;
    }

    function stripBlockedTables() {
      const taken = takenTablesFor(reserveDay(), ui.reserve.time, ui.reserve.editId);
      if (!Array.isArray(ui.reserve.tables)) ui.reserve.tables = [];
      const removed = ui.reserve.tables.filter((num) => taken.has(num));
      if (removed.length) ui.reserve.tables = ui.reserve.tables.filter((num) => !taken.has(num));
      return removed;
    }

    function clearReserveForm() {
      ui.reserve.editId = "";
      ui.reserve.name = "";
      ui.reserve.phone = "";
      ui.reserve.party = 2;
      ui.reserve.time = "";
      ui.reserve.tables = [];
      ui.reserve.note = "";
    }

    function reserveDraft() {
      const source = ui.reserve.source === "walk" ? "walk" : "pre";
      return {
        name: String(ui.reserve.name || "").trim().slice(0, 20),
        phone: phoneDigits(ui.reserve.phone),
        day: reserveDay(),
        party: Math.min(30, Math.max(1, Number(ui.reserve.party) || 1)),
        time: source === "walk" ? "" : String(ui.reserve.time || "").slice(0, 5),
        tables: (ui.reserve.tables || []).slice().sort((a, b) => a - b),
        note: String(ui.reserve.note || "").trim().slice(0, 80),
        source
      };
    }

    function submitReserve() {
      const draft = reserveDraft();
      if (!draft.name) {
        toast("예약자명을 입력해 주세요.");
        ui.confirm = null;
        render();
        return;
      }
      if (draft.phone.length < 9) {
        toast("전화번호를 입력해 주세요.");
        ui.confirm = null;
        render();
        return;
      }
      const blocked = draft.tables.filter((num) => takenTablesFor(draft.day, draft.time, ui.reserve.editId).has(num));
      if (blocked.length) {
        stripBlockedTables();
        toast("이 시간에 이미 예약된 테이블은 고를 수 없습니다.");
        ui.confirm = null;
        render();
        return;
      }
      const editing = (state.reservations || []).find((item) => item.id === ui.reserve.editId);
      if (ui.reserve.editId && !editing) {
        toast("이미 취소된 예약입니다.");
        clearReserveForm();
        ui.confirm = null;
        render();
        return;
      }
      if (editing) {
        commit({
          kind: "U",
          id: uid(),
          reserveId: editing.id,
          day: draft.day,
          name: draft.name,
          phone: draft.phone,
          party: draft.party,
          time: draft.time,
          tables: draft.tables,
          note: draft.note,
          source: draft.source
        });
        clearReserveForm();
        ui.confirm = null;
        toast("예약을 수정했습니다.");
        render();
        return;
      }
      commit({
        kind: "P",
        id: uid(),
        day: draft.day,
        at: Date.now(),
        name: draft.name,
        phone: draft.phone,
        party: draft.party,
        time: draft.time,
        tables: draft.tables,
        note: draft.note,
        source: draft.source
      });
      clearReserveForm();
      ui.confirm = null;
      toast("예약을 접수했습니다.");
      render();
    }

    function cancelReserve(reserveId) {
      commit({ kind: "Q", id: uid(), reserveId });
      ui.confirm = null;
      toast("예약을 취소했습니다.");
      render();
    }

    function confirmReserve(reserveId) {
      const item = (state.reservations || []).find((entry) => entry.id === reserveId);
      if (!item) {
        ui.confirm = null;
        render();
        return;
      }
      if (item.confirmed) {
        ui.confirm = null;
        toast("이미 확정된 예약입니다.");
        render();
        return;
      }
      commit({ kind: "F", id: uid(), reserveId });
      ui.confirm = null;
      toast("예약을 확정했습니다.");
      render();
    }

    function enterReserve(reserveId) {
      const item = (state.reservations || []).find((entry) => entry.id === reserveId);
      if (!item) {
        ui.confirm = null;
        render();
        return;
      }
      if (item.entered) {
        ui.confirm = null;
        toast("이미 입장한 팀입니다.");
        render();
        return;
      }
      commit({ kind: "E", id: uid(), reserveId, at: Date.now() });
      ui.confirm = null;
      toast("입장 처리했습니다.");
      render();
    }

    function renderHeader() {
      const day = activeDay();
      const ordering = ui.screen === "order";
      const reserving = ui.screen === "reserve";
      return `
        <header class="top">
          <div class="wrap">
            <div class="brand-row">
              <div>
                <p class="eyebrow">웃음꼬치 피식피식</p>
                <h1>물리학과 주막 POS</h1>
                <p class="sync" id="sync">${esc(syncLabel)}</p>
              </div>
              <time id="clock">${esc(hhmm(Date.now()))}</time>
            </div>
            <div class="tabs" role="tablist" aria-label="화면">

    function renderCart() {
      const draft = currentDraft();
      if (!draft.length) return "";
      return `
        <section class="cart">
          <h2>담은 메뉴</h2>
          <p class="quiet">수량은 모두 세고, 받을 금액은 직접 입력하거나 0원을 누릅니다.</p>
          ${draft.map((line) => `
            <article class="cart-line">

              </div>

    function renderMenus() {
      const menus = MENU.filter((menu) => menu.cat === ui.cat).map((menu) => {
        const lines = menu.options
          ? menu.options.map((opt) => `
              <div class="menu-line">
