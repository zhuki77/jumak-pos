        </div>
        <div class="menus">${menus}</div>`;
    }

    function renderTables() {
      const picked = currentTables();
      return `
        <h2 class="done-head">테이블</h2>
        <p class="quiet">여러 테이블을 함께 고를 수 있습니다.</p>
        <div class="table-grid" role="group" aria-label="테이블">
          ${Array.from({ length: TABLE_COUNT }, (_, index) => {
            const num = index + 1;
            const on = picked.includes(num);
            return `<button type="button" data-action="toggle-table" data-table="${num}" class="${on ? "on" : ""}" aria-pressed="${on}" aria-label="${num}번 테이블">${num}</button>`;
          }).join("")}
        </div>`;
    }

    function renderNote() {
      const day = activeDay();
      return `
        <label class="note-field">
          상세설명
          <textarea data-note maxlength="80" placeholder="없으면 비워 두세요">${esc(ui.notes[day] || "")}</textarea>
        </label>`;
    }

    function renderMenuRows(orders) {
      const counts = menuStats(orders);
      return CATEGORIES.map((cat) => {
        const items = MENU.filter((menu) => menu.cat === cat.id).flatMap((menu) => {
          if (menu.options) {
            return menu.options.map((opt) => {
              const found = counts.get(lineKey(menu.id, opt)) || { qty: 0, amount: 0 };
              return { label: `${menu.name} (${opt})`, qty: found.qty, amount: found.amount };
            });
          }
          const found = counts.get(lineKey(menu.id, "")) || { qty: 0, amount: 0 };
          return [{ label: menu.name, qty: found.qty, amount: found.amount }];
        });
        return `
          <h3 class="done-head">${esc(cat.name)}</h3>
          <div class="ranks">${items.map((row) => `
            <article class="rank"><b>${esc(row.label)}</b><strong>${row.qty}개<span>${won(row.amount)}</span></strong></article>
          `).join("")}</div>`;
      }).join("");
    }

    const PAGE_SIZE = 20;

    function renderHistoryNav() {
      const pages = [
        { id: "stats", label: "통계" },
        { id: "tables", label: "테이블별" },
        { id: "orders", label: "상세 주문" },
        { id: "stock", label: "재고" }
      ];
      return `
        <div class="filters" role="tablist" aria-label="내역 화면">
          ${pages.map((item) => `<button type="button" data-action="open-history" data-screen="${item.id}" class="${ui.screen === item.id ? "on" : ""}">${item.label}</button>`).join("")}
        </div>`;
    }

    function renderRangeFilters() {
      const filters = [
        { id: "2026-10-01", label: "1일차" },
        { id: "2026-10-02", label: "2일차" },
        { id: "all", label: "이틀 전체" }
      ];
      return `
        <div class="filters" role="tablist" aria-label="통계 기간">
          ${filters.map((item) => `<button type="button" data-action="set-range" data-range="${item.id}" class="${ui.statsRange === item.id ? "on" : ""}">${item.label}</button>`).join("")}
        </div>`;
    }

    function pageWindow(total, page) {
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      const current = Math.min(Math.max(0, page), pages - 1);
      return {
        current,
        pages,
        start: current * PAGE_SIZE,
        end: Math.min(total, (current + 1) * PAGE_SIZE)
      };
    }

    function renderPager(kind, total, page) {
      if (total <= PAGE_SIZE) return "";
      const windowed = pageWindow(total, page);
      return `
        <div class="pager">
          <button type="button" data-action="page" data-page-kind="${kind}" data-delta="-1" ${windowed.current <= 0 ? "disabled" : ""}>이전</button>
          <span>${windowed.start + 1}–${windowed.end} / ${total}</span>
          <button type="button" data-action="page" data-page-kind="${kind}" data-delta="1" ${windowed.current >= windowed.pages - 1 ? "disabled" : ""}>다음</button>
        </div>`;
    }

    function orderTables(order) {
      return [...new Set((order.tables || []).map(Number).filter((num) => num >= 1 && num <= TABLE_COUNT))];
    }

    function ordersForTable(orders, num) {
      if (!num) return orders.filter((order) => !orderTables(order).length);
      return orders.filter((order) => orderTables(order).includes(num));
    }

    function renderOrderBody(order) {
      return `
        <div class="item-list">${order.items.map((item, index) => `
          <div class="item-line">
            <b>${esc(itemLabel(item))}</b>
            <div class="item-meta">
              <span class="quiet">${item.qty}개 · ${won(item.amount)}</span>
              ${needsKitchen(item.menuId) ? `
                <div class="status-row" role="group" aria-label="${esc(itemLabel(item))} 조리 상태">
                  <button type="button" class="status-btn cook ${item.status === "cook" ? "on" : ""}" data-action="set-status" data-id="${esc(order.id)}" data-index="${index}" data-status="cook" aria-pressed="${item.status === "cook"}">조리중</button>
                  <button type="button" class="status-btn done ${item.status === "done" ? "on" : ""}" data-action="set-status" data-id="${esc(order.id)}" data-index="${index}" data-status="done" aria-pressed="${item.status === "done"}">서빙 완료</button>
                </div>` : ""}
            </div>
          </div>`).join("")}</div>
        ${order.note ? `<p>상세설명: ${esc(order.note)}</p>` : `<p class="quiet">상세설명 없음</p>`}
        <div class="order-sum"><b>총금액 ${won(order.total)}</b>
          <button type="button" class="text-btn" data-action="ask-cancel" data-id="${esc(order.id)}">주문 취소</button>
        </div>`;
    }

    function renderOrderCards(orders, pageKind, emptyText, collapsible) {
      const list = orders.slice().sort((a, b) => b.at - a.at);
      if (!list.length) return `<p class="quiet">${esc(emptyText || "접수한 주문이 없습니다.")}</p>`;
      const page = pageKind === "table" ? ui.tablePage : ui.orderPage;
      const windowed = pageWindow(list.length, page);
      if (pageKind === "table") ui.tablePage = windowed.current;
      else ui.orderPage = windowed.current;
      const visible = list.slice(windowed.start, windowed.end);
      return `
        <div class="order-list">${visible.map((order) => {
          if (!collapsible) {
            return `
              <article class="order-card">
                <div class="order-head">
                  <strong>[${esc(dayLabel(order.day))}] #${esc(orderNo(order))} - ${esc(hhmm(order.at))}</strong>
                  <span class="quiet">${esc(tableText(order.tables))}</span>
                </div>
                ${renderOrderBody(order)}
              </article>`;
          }
          const open = ui.openOrders.has(order.id);
          const served = orderFullyServed(order);
          return `
            <article class="order-card ${open ? "open" : ""} ${served ? "served" : ""}">
              <button type="button" class="order-toggle" data-action="toggle-order" data-id="${esc(order.id)}" aria-expanded="${open}" aria-label="[${esc(dayLabel(order.day))}] #${esc(orderNo(order))}${served ? " 서빙 완료" : ""} ${open ? "접기" : "펼치기"}">
                <span class="order-brief">
                  <strong>[${esc(dayLabel(order.day))}] #${esc(orderNo(order))} - ${esc(hhmm(order.at))}</strong>
                  <span class="quiet">${esc(tableText(order.tables))} · ${won(order.total)}</span>
                  ${served ? `<span class="served-mark">서빙 완료</span>` : ""}
                </span>
                <span class="order-fold">${open ? "접기" : "펼치기"}</span>
              </button>
              ${open ? `<div class="order-body">${renderOrderBody(order)}</div>` : ""}
            </article>`;
        }).join("")}</div>
        ${renderPager(pageKind === "table" ? "table" : "order", list.length, windowed.current)}`;
    }

    function stockParts(item) {
      const qty = item.qty || 0;
      if (qty <= 0) return [];
      if (item.menuId === "modum") {
        return [
          { id: "heart", qty: qty * 4 },
          { id: "pork", qty: qty * 2 },
          { id: "skin", qty: qty * 2 }
        ];
      }
      if (item.menuId === "heart") return [{ id: "heart", qty: qty * 4 }];
      if (item.menuId === "pork") return [{ id: "pork", qty: qty * 2 }];
      if (item.menuId === "skin") return [{ id: "skin", qty: qty * 2 }];
      if (item.menuId === "drink") {
        const ids = { "콜라": "cola", "제로콜라": "zerocola", "사이다": "cider" };
        const id = ids[item.option];
        return id ? [{ id, qty }] : [];
      }
      const direct = ["oden", "udon", "potato", "tomato", "earl", "grapefruit", "lemon", "water"];
      if (direct.includes(item.menuId)) return [{ id: item.menuId, qty }];
      return [];
    }

    function lineCountsTowardStock(item) {
      if (!item || item.menuId === COVER_ID) return false;
      if (needsKitchen(item.menuId)) return item.status === "done";
      return true;
    }

    function stockLevels() {
      const used = new Map(STOCK.map((item) => [item.id, 0]));
      state.orders.forEach((order) => {
        order.items.forEach((item) => {
          if (!lineCountsTowardStock(item)) return;
          stockParts(item).forEach((part) => {
            used.set(part.id, (used.get(part.id) || 0) + part.qty);
          });
        });
      });
      return STOCK.map((item) => {
        const spent = used.get(item.id) || 0;
        const left = item.initial - spent;
        const level = left <= 0 ? "out" : left * 10 <= item.initial ? "low" : "";
        return { ...item, spent, left, level };
      });
    }

    function renderStockScreen() {
      const rows = stockLevels();
      const groups = [];
      rows.forEach((row) => {
        const group = groups.find((item) => item.name === row.group);
        if (group) group.rows.push(row);
        else groups.push({ name: row.group, rows: [row] });
      });
      return `
        <h2>재고</h2>
        ${renderHistoryNav()}
        <p class="quiet">꼬치, 식사, 설탕토마토는 서빙 완료된 수량만 빠집니다. 하이볼, 음료, 생수는 주문이 접수되면 바로 빠집니다. 모둠꼬치는 염통 4개, 목살 2개, 닭껍질 2개를 함께 사용합니다.</p>
        ${groups.map((group) => `
          <h3 class="done-head">${esc(group.name)}</h3>
          <div class="ranks">${group.rows.map((row) => `
            <article class="rank stock-row ${row.level}">
              <div>
                <b>${esc(row.name)}</b>
                <span class="meta">시작 ${row.initial}${esc(row.unit)} · 사용 ${row.spent}${esc(row.unit)}</span>
                ${row.pack ? `<span class="meta">단품으로 ${Math.floor(row.left / row.pack)}세트</span>` : ""}
                ${row.piece ? `<span class="meta">남은 조각 ${row.left * row.piece}개</span>` : ""}
                ${row.note ? `<span class="meta">${esc(row.note)}</span>` : ""}
              </div>
              <strong>${row.left}${esc(row.unit)}</strong>
            </article>`).join("")}</div>`).join("")}`;
    }

    function renderStatsScreen() {
      const orders = rangeOrders();
      const totals = sumOrders(orders);
      return `
        <h2>주문 내역 & 통계</h2>
        ${renderHistoryNav()}
        ${renderRangeFilters()}
        <div class="summary">
          <article><span>총 매출액</span><strong>${won(totals.revenue)}</strong></article>
          <article><span>총 주문 건수</span><strong>${totals.count}건</strong></article>
        </div>
        <h2 class="done-head">메뉴별 판매</h2>
        ${renderMenuRows(orders)}
        <h3 class="done-head">상차림비</h3>
        <div class="ranks">
          <article class="rank"><b>상차림비</b><strong>${totals.coverQty}개<span>${won(totals.coverAmount)}</span></strong></article>
        </div>
        <section class="panel total-zone">
          <h2>합계</h2>
          <div class="ranks" style="margin-top:10px">
            <article class="rank total"><b>합계</b><strong>${won(totals.revenue)}</strong></article>
          </div>
        </section>
        <p class="reset-slot"><button type="button" class="reset-mini" data-action="ask-reset" data-range="${esc(ui.statsRange)}">${ui.statsRange === "all" ? "이틀 전체 초기화" : `${esc(dayLabel(ui.statsRange))} 초기화`}</button></p>`;
    }

    function renderTablesScreen() {
      const orders = rangeOrders();
      const noneCount = ordersForTable(orders, 0).length;
      let focus = ui.tableFocus;
      if (focus === 0 && !noneCount) focus = 1;
      if (!(focus === 0 || (focus >= 1 && focus <= TABLE_COUNT))) focus = 1;
      ui.tableFocus = focus;
      const picked = ordersForTable(orders, focus);
      const amount = picked.reduce((sum, order) => sum + order.total, 0);
      return `
        <h2>테이블별 주문</h2>
        ${renderHistoryNav()}
        ${renderRangeFilters()}
        <p class="quiet">테이블을 누르면 그 테이블 주문이 나옵니다. 주문을 누르면 메뉴가 펼쳐집니다. 여러 테이블에 걸린 주문은 해당 테이블마다 보입니다.</p>
        <div class="table-grid lookup" role="tablist" aria-label="테이블별 주문">
          ${Array.from({ length: TABLE_COUNT }, (_, index) => {
            const num = index + 1;
            const count = ordersForTable(orders, num).length;
            const on = focus === num;
            return `<button type="button" data-action="pick-table" data-table="${num}" class="${on ? "on" : ""}" aria-pressed="${on}" aria-label="${num}번 테이블, ${count}건"><b>${num}</b><small>${count}건</small></button>`;
          }).join("")}
        </div>
        ${noneCount ? `<button type="button" class="list-btn ${focus === 0 ? "on" : ""}" data-action="pick-table" data-table="0" style="width:100%;margin-top:8px" aria-pressed="${focus === 0}">테이블 없음 · ${noneCount}건</button>` : ""}
        <p class="done-head"><b>${focus ? `${focus}번 테이블` : "테이블 없음"}</b> · ${picked.length}건 · ${won(amount)}</p>
        ${renderOrderCards(picked, "table", "이 테이블 주문이 없습니다.", true)}`;
    }

    function renderOrdersScreen() {
      const orders = rangeOrders();
      return `
        <h2>상세 주문</h2>
        ${renderHistoryNav()}
        ${renderRangeFilters()}
        <p class="quiet">주문을 누르면 메뉴가 펼쳐집니다. 최신 주문부터 20건씩 봅니다.</p>
        ${renderOrderCards(orders, "order", "", true)}`;
    }

    function renderConfirm() {
      const confirm = ui.confirm;
      if (!confirm) return "";
      return `
        <div class="overlay">
          <section class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
            <h3 id="confirm-title">${esc(confirm.title)}</h3>
            <p>${esc(confirm.message)}</p>
            <div class="confirm-actions">
              <button type="button" class="ghost" data-action="confirm-no">취소</button>
              <button type="button" class="${confirm.danger ? "danger-btn" : "pay"}" data-action="confirm-yes">${esc(confirm.yes)}</button>
            </div>
          </section>
        </div>`;
    }

    function renderDock() {
      const draft = currentDraft();
      if (!draft.length) return "";
      return `
        <div class="dock">
          <div class="wrap">
            <div>
              <span class="quiet">받을 금액</span>
              <b id="cart-total">${won(cartTotal())}</b>
            </div>
            <button type="button" class="pay" data-action="ask-submit">주문 접수</button>
          </div>
        </div>`;
    }

    function renderReserveScreen() {
      const day = reserveDay();
      const picked = ui.reserve.tables || [];
      const editing = Boolean((state.reservations || []).find((item) => item.id === ui.reserve.editId));
      const source = ui.reserve.source === "walk" ? "walk" : "pre";
      const list = (state.reservations || []).filter((item) => item.day === day).slice().sort((a, b) => {
        const left = a.time || "99:99";
        const right = b.time || "99:99";
        if (left !== right) return left.localeCompare(right);
        return a.at - b.at;
      });
      const preList = list.filter((item) => item.source !== "walk");
      const walkList = list.filter((item) => item.source === "walk");
      const waiting = walkList.filter((item) => !item.entered).sort((a, b) => a.at - b.at);
      const seated = walkList.filter((item) => item.entered).sort((a, b) => (b.enteredAt || b.at) - (a.enteredAt || a.at));
      const waitPeople = waiting.reduce((sum, item) => sum + (Number(item.party) || 0), 0);
      const taken = takenTablesFor(day, ui.reserve.time, ui.reserve.editId);
      const timeLabel = String(ui.reserve.time || "").slice(0, 5);
      const reserveCards = (items, empty) => items.length ? `<div class="order-list" style="margin-top:12px">${items.map((item, index) => {
          const slotLabel = item.source === "walk" ? (item.entered ? "입장" : `대기 ${index + 1}번째`) : (item.time ? esc(item.time) : "시간 미정");
          return `
          <article class="order-card ${ui.reserve.editId === item.id ? "editing" : ""}">
            <div class="order-head">
              <strong>${esc(item.name)}<span class="source-tag${item.source === "walk" ? " walk" : ""}">${item.source === "walk" ? "현장" : "사전"}</span></strong>
              <span>${esc(phoneText(item.phone))}</span>
            </div>
            <p>${esc(dayLabel(item.day))} · ${slotLabel} · ${item.party}명 · ${item.tables && item.tables.length ? esc(tableText(item.tables)) : "테이블 미정"}</p>
            ${item.note ? `<p>메모: ${esc(item.note)}</p>` : ""}
            ${ui.reserve.editId === item.id ? `<p class="quiet">이 예약을 수정하고 있습니다.</p>` : ""}
            <div class="order-sum"><b>${esc(hhmm(item.at))} 접수${item.confirmed ? " · 확정" : ""}</b>
              <span class="reserve-actions">
                <button type="button" class="list-btn" data-action="edit-reserve" data-id="${esc(item.id)}">수정</button>
                ${item.source === "walk"
                  ? `<button type="button" class="enter-reserve${item.entered ? " on" : ""}" data-action="ask-enter-reserve" data-id="${esc(item.id)}" ${item.entered ? "disabled" : ""}>${item.entered ? "입장 완료" : "입장"}</button>`
                  : `<button type="button" class="confirm-reserve${item.confirmed ? " on" : ""}" data-action="ask-confirm-reserve" data-id="${esc(item.id)}" ${item.confirmed ? "disabled" : ""} aria-pressed="${item.confirmed ? "true" : "false"}">예약 확정</button>`}
                <button type="button" class="text-btn" data-action="ask-cancel-reserve" data-id="${esc(item.id)}">예약 취소</button>
              </span>
            </div>
          </article>`;
        }).join("")}</div>` : `<p class="quiet" style="margin-top:12px">${empty}</p>`;
      return `
        <h2>${editing ? "예약 수정" : "예약"}</h2>
        <p class="quiet">${editing ? "고친 내용을 저장하면 다른 기기에도 같이 바뀝니다." : "예약자명과 전화번호를 적고 접수합니다. 다른 기기에도 같이 보입니다."}</p>
        <div class="filters" role="tablist" aria-label="예약 일차">
          ${FESTIVAL_DAYS.map((item) => `<button type="button" data-action="reserve-day" data-day="${item.key}" class="${day === item.key ? "on" : ""}">${item.label}</button>`).join("")}
        </div>
        <div class="filters" role="tablist" aria-label="예약 종류">
          <button type="button" data-action="reserve-source" data-source="pre" class="${source === "pre" ? "on" : ""}">사전 예약</button>
          <button type="button" data-action="reserve-source" data-source="walk" class="${source === "walk" ? "on" : ""}">현장 예약</button>
        </div>
        <p class="quiet">${source === "walk" ? "현장 예약은 방문 시간 없이 선착순으로 받습니다. 대기 팀 수가 아래에 나옵니다." : "사전 예약이 목록 위에 먼저 나옵니다."}</p>
        <label class="note-field">예약자명
          <input data-reserve="name" maxlength="20" autocomplete="off" placeholder="이름을 입력하세요" value="${esc(ui.reserve.name || "")}">
        </label>
        <label class="note-field">전화번호
          <input data-reserve="phone" inputmode="tel" maxlength="13" autocomplete="off" placeholder="숫자만 입력하세요" value="${esc(phoneDigits(ui.reserve.phone))}">
        </label>
        <div class="cart-top" style="margin-top:14px">
          <strong>인원</strong>
          <span class="stepper">
            <button type="button" data-action="reserve-party" data-delta="-1" aria-label="인원 줄이기">−</button>
            <b>${Math.min(30, Math.max(1, Number(ui.reserve.party) || 1))}명</b>
            <button type="button" data-action="reserve-party" data-delta="1" aria-label="인원 늘리기">+</button>
          </span>
        </div>
        ${source === "walk" ? "" : `<label class="note-field">방문 시간
          <input data-reserve="time" type="time" value="${esc(ui.reserve.time || "")}">
        </label>`}
        <h2 class="done-head">테이블</h2>
        <p class="quiet" id="table-hint">${source === "walk" ? "입장할 테이블이 정해졌으면 고르세요. 아직 없으면 비워 두세요." : timeLabel ? `${esc(timeLabel)}에 이미 예약된 테이블은 고를 수 없습니다.` : "시간을 고르면 그 시각에 잡힌 테이블은 비활성화됩니다."}</p>
        <div class="table-grid" role="group" aria-label="예약 테이블">
          ${Array.from({ length: TABLE_COUNT }, (_, index) => {
            const num = index + 1;
            const blocked = taken.has(num);
            const on = !blocked && picked.includes(num);
            return `<button type="button" data-action="reserve-table" data-table="${num}" class="${on ? "on" : ""}" ${blocked ? "disabled" : ""} aria-pressed="${on}" aria-label="${num}번 테이블${blocked ? ", 이 시간 예약됨" : ""}">${num}</button>`;
          }).join("")}
        </div>
        <label class="note-field">메모
          <textarea data-reserve="note" maxlength="80" placeholder="없으면 비워 두세요">${esc(ui.reserve.note || "")}</textarea>
        </label>
        <button type="button" class="pay" data-action="ask-reserve" style="width:100%;margin-top:14px">${editing ? "수정 저장" : "예약 접수"}</button>
        ${editing ? `<button type="button" class="ghost" data-action="cancel-edit-reserve" style="width:100%;min-height:52px;margin-top:8px">수정 취소</button>` : ""}
        <h2 class="done-head">${esc(dayLabel(day))} 사전 예약</h2>
        ${reserveCards(preList, "사전 예약이 없습니다.")}
        <h2 class="done-head">${esc(dayLabel(day))} 현장 예약</h2>
        <div class="summary">
          <article><span>대기</span><strong>${waiting.length}팀</strong></article>
          <article><span>대기 인원</span><strong>${waitPeople}명</strong></article>
        </div>
        <p class="quiet">먼저 받은 팀이 위에 있습니다. 입장하면 대기에서 빠집니다.</p>
        ${reserveCards(waiting, "대기 팀이 없습니다.")}
        ${seated.length ? `<h3 class="done-head">입장한 팀</h3>${reserveCards(seated, "")}` : ""}`;
    }

    function render() {
      const day = activeDay();
      ui.day = day;
      const meta = FESTIVAL_DAYS.find((item) => item.key === day);
      const ordering = ui.screen === "order";
      const reserving = ui.screen === "reserve";
      const history = ordering || reserving ? "" : ui.screen === "tables" ? renderTablesScreen() : ui.screen === "orders" ? renderOrdersScreen() : ui.screen === "stock" ? renderStockScreen() : renderStatsScreen();
      document.getElementById("app").innerHTML = `
        ${renderHeader()}
        <main class="wrap">
          ${ordering ? `
            <h2>${esc(meta.label)} 주문 입력</h2>
            <p class="quiet">${esc(dayTitle(day))} · 할인은 금액을 고치고, 서비스는 0원을 선택합니다.</p>
            ${renderTables()}
            ${renderMenus()}
            ${renderCart()}
            ${renderNote()}
          ` : reserving ? renderReserveScreen() : history}
        </main>
        ${ordering ? renderDock() : ""}
        ${renderConfirm()}`;
      document.body.classList.toggle("modal-open", Boolean(ui.confirm));
    }

    function onClick(event) {
      const btn = event.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === "set-day") {
        ui.day = btn.dataset.day;
        ui.screen = "order";
        ui.optionFor = "";
        ui.confirm = null;
        render();
      } else if (action === "open-stats") {
        ui.screen = "stats";
        ui.confirm = null;
        render();
      } else if (action === "open-reserve") {
        ui.screen = "reserve";
        ui.confirm = null;
        render();
      } else if (action === "reserve-day") {
        ui.reserve.day = btn.dataset.day;
        const removed = stripBlockedTables();
        render();
        if (removed.length) toast("이 시간에 이미 예약된 테이블은 뺐습니다.");
      } else if (action === "reserve-source") {
        ui.reserve.source = btn.dataset.source === "walk" ? "walk" : "pre";
        if (ui.reserve.source === "walk") ui.reserve.time = "";
        render();
      } else if (action === "reserve-party") {
        const next = (Number(ui.reserve.party) || 1) + (Number(btn.dataset.delta) || 0);
        ui.reserve.party = Math.min(30, Math.max(1, next));
        render();
      } else if (action === "reserve-table") {
        const num = Number(btn.dataset.table);
        if (num < 1 || num > TABLE_COUNT) return;
        if (takenTablesFor(reserveDay(), ui.reserve.time, ui.reserve.editId).has(num)) {
          toast("이 시간에 이미 예약된 테이블입니다.");
          return;
        }
        if (!Array.isArray(ui.reserve.tables)) ui.reserve.tables = [];
        const index = ui.reserve.tables.indexOf(num);
        if (index >= 0) ui.reserve.tables.splice(index, 1);
        else ui.reserve.tables.push(num);
        ui.reserve.tables.sort((a, b) => a - b);
        render();
      } else if (action === "ask-reserve") {
        const draft = reserveDraft();
        if (!draft.name) {
          toast("예약자명을 입력해 주세요.");
          return;
        }
        if (draft.phone.length < 9) {
          toast("전화번호를 입력해 주세요.");
          return;
        }
        const blocked = draft.tables.filter((num) => takenTablesFor(draft.day, draft.time, ui.reserve.editId).has(num));
        if (blocked.length) {
          stripBlockedTables();
          toast("이 시간에 이미 예약된 테이블은 고를 수 없습니다.");
          render();
          return;
        }
        const day = FESTIVAL_DAYS.find((item) => item.key === draft.day);
        const editing = Boolean(ui.reserve.editId);
        ui.confirm = {
          title: editing ? "예약 수정" : `${day.label} 예약`,
          message: `${draft.source === "walk" ? "현장 예약" : "사전 예약"} · ${draft.name} · ${phoneText(draft.phone)} · ${draft.party}명${draft.time ? ` · ${draft.time}` : ""} · ${draft.tables.length ? tableText(draft.tables) : "테이블 미정"}으로 ${editing ? "수정합니다." : "예약합니다."}`,
          yes: editing ? "수정 저장" : "예약 접수",
          danger: false,
          run: submitReserve
        };
        render();
      } else if (action === "edit-reserve") {
        const item = (state.reservations || []).find((entry) => entry.id === btn.dataset.id);
        if (!item) return;
        ui.reserve.editId = item.id;
        ui.reserve.day = item.day;
        ui.reserve.name = item.name;
        ui.reserve.phone = item.phone;
        ui.reserve.party = item.party;
        ui.reserve.time = item.time || "";
        ui.reserve.tables = (item.tables || []).slice();
        ui.reserve.note = item.note || "";
        ui.reserve.source = item.source === "walk" ? "walk" : "pre";
        ui.confirm = null;
        render();
        window.scrollTo(0, 0);
      } else if (action === "cancel-edit-reserve") {
        clearReserveForm();
        ui.confirm = null;
        render();
      } else if (action === "ask-confirm-reserve") {
        const reserveId = btn.dataset.id;
        const item = (state.reservations || []).find((entry) => entry.id === reserveId);
        if (!item || item.confirmed) return;
        ui.confirm = {
          title: "예약 확정",
          message: `${item.name} · ${phoneText(item.phone)} 예약을 확정하시겠습니까?`,
          yes: "예약 확정",
          danger: false,
          run: () => confirmReserve(reserveId)
        };
        render();
      } else if (action === "ask-enter-reserve") {
        const reserveId = btn.dataset.id;
        const item = (state.reservations || []).find((entry) => entry.id === reserveId);
        if (!item || item.entered) return;
        ui.confirm = {
          title: "입장",
          message: `${item.name} · ${item.party}명 팀을 입장 처리할까요? 대기에서 빠집니다.`,
          yes: "입장",
          danger: false,
          run: () => enterReserve(reserveId)
        };
        render();
      } else if (action === "ask-cancel-reserve") {
        const reserveId = btn.dataset.id;
        ui.confirm = {
          title: "예약 취소",
          message: "이 예약을 취소하시겠습니까?",
          yes: "예약 취소",
          danger: true,
          run: () => cancelReserve(reserveId)
        };
        render();
      } else if (action === "open-history") {
        ui.screen = btn.dataset.screen || "stats";
        ui.confirm = null;
        render();
      } else if (action === "set-range") {
        ui.statsRange = btn.dataset.range;
        ui.tablePage = 0;
        ui.orderPage = 0;
        render();
      } else if (action === "page") {
        const delta = Number(btn.dataset.delta) || 0;
        if (btn.dataset.pageKind === "table") ui.tablePage += delta;
        else ui.orderPage += delta;
        render();
      } else if (action === "toggle-order") {
        const id = btn.dataset.id;
        if (ui.openOrders.has(id)) ui.openOrders.delete(id);
        else ui.openOrders.add(id);
        render();
      } else if (action === "pick-table") {
        const num = Number(btn.dataset.table);
        if (num < 0 || num > TABLE_COUNT) return;
        ui.tableFocus = num;
        ui.tablePage = 0;
        render();
      } else if (action === "inc-menu") {
        addLine(btn.dataset.id, btn.dataset.option || "");
        render();
      } else if (action === "dec-menu") {
        changeQty(lineKey(btn.dataset.id, btn.dataset.option || ""), -1);
        render();
      } else if (action === "set-cat") {
        ui.cat = btn.dataset.cat;
        ui.optionFor = "";
        render();
      } else if (action === "add-item") {
        const menu = MENU.find((item) => item.id === btn.dataset.id);
        if (!menu) return;
        if (menu.options) {
          ui.optionFor = ui.optionFor === menu.id ? "" : menu.id;
          render();
          return;
        }
        addLine(menu.id, "");
        render();
      } else if (action === "pick-option") {
        addLine(btn.dataset.id, btn.dataset.option);
        ui.optionFor = "";
        render();
      } else if (action === "inc") {
        changeQty(btn.dataset.key, 1);
        render();
      } else if (action === "dec") {
        changeQty(btn.dataset.key, -1);
        render();
      } else if (action === "zero") {
        setAmount(btn.dataset.key, 0, true);
        render();
      } else if (action === "list") {
        setAmount(btn.dataset.key, 0, false);
        render();
      } else if (action === "toggle-table") {
        const num = Number(btn.dataset.table);
        if (num < 1 || num > TABLE_COUNT) return;
        const tables = currentTables();
        const index = tables.indexOf(num);
        if (index >= 0) tables.splice(index, 1);
        else tables.push(num);
        tables.sort((a, b) => a - b);
        render();
      } else if (action === "ask-submit") {
        const day = FESTIVAL_DAYS.find((item) => item.key === activeDay());
        const tables = currentTables();
        if (!tables.length) {
          toast("테이블을 골라 주세요.");
          return;
        }
        ui.confirm = {
          title: `${day.label} 주문 접수`,
          message: `${tableText(tables)} · ${won(cartTotal())}으로 접수합니다. 수량은 그대로 집계되고, 입력한 금액이 매출입니다.`,
          yes: "주문 접수",
          danger: false,
          run: submitOrder
        };
        render();
      } else if (action === "set-status") {
        setStatus(btn.dataset.id, Number(btn.dataset.index), btn.dataset.status);
      } else if (action === "ask-cancel") {
        const orderId = btn.dataset.id;
        ui.confirm = {
          title: "주문 취소",
          message: "이 주문을 취소하시겠습니까?",
          yes: "주문 취소",
          danger: true,
          run: () => cancelOrder(orderId)
        };
        render();
      } else if (action === "ask-reset") {
        const range = btn.dataset.range;
        if (range === "all") {
          ui.confirm = {
            title: "이틀 전체 초기화",
            message: "1일차와 2일차 접수가 모두 삭제됩니다. 삭제한 데이터는 되돌릴 수 없습니다.",
            yes: "이틀 전체 삭제",
            danger: true,
            run: () => resetDays(FESTIVAL_DAYS.map((item) => item.key))
          };
        } else {
          const day = FESTIVAL_DAYS.find((item) => item.key === range);
          if (!day) return;
          ui.confirm = {
            title: `${day.label} 초기화`,
            message: `${day.label} 접수만 삭제됩니다. 다른 일차는 그대로 남고, 삭제한 데이터는 되돌릴 수 없습니다.`,
            yes: `${day.label} 삭제`,
            danger: true,
            run: () => resetDays([day.key])
          };
        }
        render();
      } else if (action === "confirm-no") {
        ui.confirm = null;
        render();
      } else if (action === "confirm-yes") {
        const run = ui.confirm && ui.confirm.run;
        ui.confirm = null;
        if (run) run();
        else render();
      } else if (action === "add-cover") {
        addLine(COVER_ID, "");
        render();
      }
    }

    function onAmount(event) {
      const field = event.target.closest("[data-reserve]");
      if (field) {
        const key = field.dataset.reserve;
        if (key === "name") ui.reserve.name = String(field.value || "").slice(0, 20);
        else if (key === "phone") {
          const digits = phoneDigits(field.value);
          ui.reserve.phone = digits;
          if (field.value !== digits) field.value = digits;
        } else if (key === "time") {
          ui.reserve.time = String(field.value || "").slice(0, 5);
          const removed = stripBlockedTables();
          const taken = takenTablesFor(reserveDay(), ui.reserve.time, ui.reserve.editId);
          const hint = document.getElementById("table-hint");
          const slot = String(ui.reserve.time || "").slice(0, 5);
          if (hint) hint.textContent = slot ? `${slot}에 이미 예약된 테이블은 고를 수 없습니다.` : "시간을 고르면 그 시각에 잡힌 테이블은 비활성화됩니다.";
          document.querySelectorAll("[data-action='reserve-table']").forEach((tableBtn) => {
            const num = Number(tableBtn.dataset.table);
            const blocked = taken.has(num);
            const on = !blocked && (ui.reserve.tables || []).includes(num);
            tableBtn.disabled = blocked;
            tableBtn.classList.toggle("on", on);
            tableBtn.setAttribute("aria-pressed", on ? "true" : "false");
            tableBtn.setAttribute("aria-label", blocked ? `${num}번 테이블, 이 시간 예약됨` : `${num}번 테이블`);
          });
          if (removed.length) toast("이 시간에 이미 예약된 테이블은 뺐습니다.");
        }
        else if (key === "note") ui.reserve.note = String(field.value || "").slice(0, 80);
        return;
      }
      const note = event.target.closest("[data-note]");
      if (note) {
        ui.notes[activeDay()] = String(note.value || "").slice(0, 80);
        return;
      }
      const input = event.target.closest("[data-amount]");
      if (!input) return;
      const digits = String(input.value).replace(/[^\d]/g, "");
      const line = currentDraft().find((item) => item.key === input.dataset.amount);
      if (!line) return;
      line.amount = digits === "" ? 0 : Math.min(9999999, Number(digits));
      line.custom = true;
      if (input.value !== digits) input.value = digits;
      const total = document.getElementById("cart-total");
      if (total) total.textContent = won(cartTotal());
    }

    rememberBundle();
    const app = document.getElementById("app");
    app.addEventListener("click", onClick);
    app.addEventListener("input", onAmount);
    render();
    setInterval(() => {
      const clock = document.getElementById("clock");
      if (clock) clock.textContent = hhmm(Date.now());
    }, 1000);
    enqueue(async () => {
      try {
        await pushPending();
        await pull();
      } catch (err) {
        syncLabel = "연결을 다시 시도하는 중";
        paintSync();
      }
    });
    setInterval(() => {
      enqueue(async () => {
        try {
          await pushPending();
          await pull();
        } catch (err) {
          syncLabel = "연결을 다시 시도하는 중";
          paintSync();
        }
      });
    }, 2500);
  </script>
</body>
</html>
